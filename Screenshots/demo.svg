<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="624" viewBox="0 0 1180 624">
<rect width="1180" height="624" rx="12" fill="#0b1120"/>
<circle cx="24" cy="22" r="6" fill="#ef4444"/><circle cx="44" cy="22" r="6" fill="#f59e0b"/><circle cx="64" cy="22" r="6" fill="#22c55e"/>
<text x="590.0" y="27" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal">swift&#160;run&#160;DockerfileClaimDemo&#160;(scenarios&#160;2&#160;and&#160;3,&#160;real&#160;output;&#160;full&#160;text&#160;in&#160;demo-output.txt)</text>
<text x="20" y="58" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">2.&#160;COPY&#160;of&#160;a&#160;directory&#160;copies&#160;what&#160;is&#160;inside&#160;it</text>
<text x="20" y="76" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">-----------------------------------------------</text>
<text x="20" y="94" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;answer:&#160;`COPY&#160;app&#160;/srv`&#160;puts&#160;`app/main.py`&#160;at&#160;`/srv/app/main.py`.</text>
<text x="20" y="112" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;verdict:&#160;wrong&#160;(1&#160;claim&#160;checked,&#160;0&#160;hold,&#160;1&#160;wrong)</text>
<text x="20" y="130" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;-&#160;[wrong]&#160;It&#160;does&#160;not&#160;hold&#160;that&#160;`app/main.py`&#160;ends&#160;up&#160;at&#160;`/srv/app/main.py`:&#160;`COPY`&#160;of&#160;a&#160;directory&#160;copies&#160;what&#160;is&#160;inside&#160;it,&#160;not&#160;the&#160;directory&#160;</text>
<text x="20" y="148" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;itself;&#160;Docker&#160;puts&#160;it&#160;at&#160;`/srv/main.py`.</text>
<text x="20" y="166" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;rewrite:&#160;`app/main.py`&#160;lands&#160;at&#160;`/srv/main.py`,&#160;which&#160;is&#160;what&#160;`CMD`&#160;runs.</text>
<text x="20" y="184" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;verdict:&#160;verified&#160;(1&#160;claim&#160;checked,&#160;1&#160;hold)</text>
<text x="20" y="202" fill="#86efac" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;-&#160;[holds]&#160;It&#160;holds&#160;that&#160;`app/main.py`&#160;ends&#160;up&#160;at&#160;`/srv/main.py`.</text>
<text x="20" y="220" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal"></text>
<text x="20" y="238" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal"></text>
<text x="20" y="256" fill="#93c5fd" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">3.&#160;Dockerfile&#160;lines&#160;that&#160;do&#160;not&#160;do&#160;what&#160;they&#160;are&#160;written&#160;to&#160;do</text>
<text x="20" y="274" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">--------------------------------------------------------------</text>
<text x="20" y="292" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;ARG&#160;APP_VERSION=1.4.2</text>
<text x="20" y="310" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;FROM&#160;node:20-slim</text>
<text x="20" y="328" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;RUN&#160;mkdir&#160;-p&#160;/app&#160;&amp;&amp;&#160;cd&#160;/app</text>
<text x="20" y="346" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;COPY&#160;package.json&#160;package-lock.json&#160;.</text>
<text x="20" y="364" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;RUN&#160;npm&#160;ci</text>
<text x="20" y="382" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;RUN&#160;echo&#160;"$APP_VERSION"&#160;&gt;&#160;/version</text>
<text x="20" y="400" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;ENV&#160;PORT=3000</text>
<text x="20" y="418" fill="#94a3b8" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;|&#160;CMD&#160;["node",&#160;"server.js",&#160;"--port",&#160;"$PORT"]</text>
<text x="20" y="436" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;verdict:&#160;wrong&#160;(4&#160;claims&#160;checked,&#160;0&#160;hold,&#160;1&#160;to&#160;check,&#160;3&#160;wrong)</text>
<text x="20" y="454" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;-&#160;[wrong]&#160;It&#160;does&#160;not&#160;hold&#160;that&#160;`RUN&#160;mkdir&#160;-p&#160;/app&#160;&amp;&amp;&#160;cd&#160;/app`&#160;works&#160;as&#160;written:&#160;each&#160;`RUN`&#160;starts&#160;a&#160;new&#160;shell,&#160;so&#160;`cd`&#160;ends&#160;with&#160;it;&#160;`WORKDIR`&#160;is&#160;</text>
<text x="20" y="472" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;what&#160;lasts;&#160;write&#160;`WORKDIR&#160;/app`&#160;instead.</text>
<text x="20" y="490" fill="#fcd34d" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;-&#160;[check]&#160;`COPY&#160;package.json&#160;package-lock.json&#160;.`&#160;stops&#160;the&#160;classic&#160;builder:&#160;several&#160;sources&#160;need&#160;a&#160;destination&#160;ending&#160;in&#160;`/`;&#160;write&#160;`./`&#160;instead;&#160;</text>
<text x="20" y="508" fill="#fcd34d" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;BuildKit&#160;was&#160;not&#160;checked.</text>
<text x="20" y="526" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;-&#160;[wrong]&#160;It&#160;does&#160;not&#160;hold&#160;that&#160;`RUN&#160;echo&#160;"$APP_VERSION"&#160;&gt;&#160;/version`&#160;works&#160;as&#160;written:&#160;an&#160;`ARG`&#160;declared&#160;before&#160;`FROM`&#160;is&#160;visible&#160;only&#160;to&#160;`FROM`&#160;</text>
<text x="20" y="544" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;lines&#160;until&#160;the&#160;stage&#160;declares&#160;it&#160;again;&#160;write&#160;`ARG&#160;APP_VERSION`&#160;instead.</text>
<text x="20" y="562" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;-&#160;[wrong]&#160;It&#160;does&#160;not&#160;hold&#160;that&#160;`CMD&#160;["node",&#160;"server.js",&#160;"--port",&#160;"$PORT"]`&#160;works&#160;as&#160;written:&#160;the&#160;exec&#160;(JSON)&#160;form&#160;runs&#160;no&#160;shell,&#160;so&#160;`$`&#160;names&#160;</text>
<text x="20" y="580" fill="#fca5a5" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal">&#160;&#160;&#160;&#160;&#160;&#160;&#160;are&#160;passed&#160;on&#160;as&#160;written;&#160;write&#160;`CMD&#160;["sh",&#160;"-c",&#160;"node&#160;server.js&#160;--port&#160;$PORT"]`&#160;instead.</text>
<text x="20" y="598" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="12" text-anchor="start" font-weight="normal"></text>
</svg>
